{% extends 'base.html' %}

{% block title %}Aptest - Add Question{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow">
            <div class="card-header bg-success text-white py-3">
                <h4 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Add New Question</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('add_question') }}" method="POST">
                    <div class="mb-4">
                        <label for="question_text" class="form-label fw-semibold">Question Text</label>
                        <textarea class="form-control" id="question_text" name="question_text" rows="3" required></textarea>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="option_a" class="form-label fw-semibold">Option A</label>
                            <input type="text" class="form-control" id="option_a" name="option_a" required>
                        </div>
                        <div class="col-md-6">
                            <label for="option_b" class="form-label fw-semibold">Option B</label>
                            <input type="text" class="form-control" id="option_b" name="option_b" required>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="option_c" class="form-label fw-semibold">Option C</label>
                            <input type="text" class="form-control" id="option_c" name="option_c" required>
                        </div>
                        <div class="col-md-6">
                            <label for="option_d" class="form-label fw-semibold">Option D</label>
                            <input type="text" class="form-control" id="option_d" name="option_d" required>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-4">
                            <label for="correct_answer" class="form-label fw-semibold">Correct Answer</label>
                            <select class="form-select" id="correct_answer" name="correct_answer" required>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="subject" class="form-label fw-semibold">Subject</label>
                            <select class="form-select" id="subject" name="subject" required>
                                <option value="Aptitude">Aptitude</option>
                                <option value="Logical Reasoning">Logical Reasoning</option>
                                <option value="English Grammar">English Grammar</option>
                                <option value="General Knowledge">General Knowledge</option>
                                <option value="Verbal Ability">Verbal Ability</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="difficulty" class="form-label fw-semibold">Difficulty</label>
                            <select class="form-select" id="difficulty" name="difficulty" required>
                                <option value="Easy">Easy</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="Hard">Hard</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle me-1"></i>Add Question
                        </button>
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
