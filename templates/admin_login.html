{% extends 'base.html' %}

{% block title %}Aptest - Admin Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg border-0">
            <div class="card-header text-white text-center py-4" style="background-color: #83AF0A;">
                <i class="bi bi-shield-lock display-4"></i>
                <h3 class="mt-2 mb-0">Admin Login</h3>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('admin_login') }}" method="POST">
                    <div class="mb-4">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control form-control-lg" id="username" name="username" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" required>
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-lg" style="background-color: #83AF0A;">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Login
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3">
                <small class="text-muted">Default: admin / admin123</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
